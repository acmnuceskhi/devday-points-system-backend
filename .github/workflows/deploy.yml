name: Deploy

on:
  push:
    branches: [dev, main, prod]

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPO: devday-points-backend
      SERVICE_NAME: devday-points-backend-${{ github.ref_name }}
      CLUSTER_NAME: devday-${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy new image to ${{ github.ref_name }}
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          aws ecs update-express-gateway-service \
            --service-name "$SERVICE_NAME" \
            --cluster "$CLUSTER_NAME" \
            --primary-container "{\"image\":\"$IMAGE\"}" \
            --region "$AWS_REGION" \
            --monitor-resources
