name: Deploy to AWS ECS

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devday-points-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/devday-points-backend:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/devday-points-backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy new image to ECS Express Mode
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs update-express-gateway-service \
            --service-name devday-points-backend \
            --image "$IMAGE" \
            --region ${{ secrets.AWS_REGION }}
